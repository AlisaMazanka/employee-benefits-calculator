<h2>Benefits Calculator</h2>
<form [formGroup]="formGroup" class="benefits-form">
    <section formGroupName="employee" class="form-section">
        <h3>Employee details</h3>
        <div class="form-grid">
            <label>
                <span class="required-label">First name</span>
                <input type="text" formControlName="firstName" />
                @if (isControlInvalid(form.controls.employee.controls.firstName)) {
                <div class="form-error">First name is required</div>
                }
            </label>
            <label>
                <span class="required-label">Last name</span>
                <input type="text" formControlName="lastName" />
                @if (isControlInvalid(form.controls.employee.controls.lastName)) {
                <div class="form-error">Last name is required</div>
                }
            </label>
            <label>
                <span class="required-label">Date of birth</span>
                <input type="date" formControlName="dateOfBirth" />
                @if (isControlInvalid(form.controls.employee.controls.dateOfBirth)) {
                <div class="form-error">Date of birth is required</div>
                }
            </label>
            <label>
                <span class="required-label">Employment start date</span>
                <input type="date" formControlName="employmentStartDate" />
                @if (isControlInvalid(form.controls.employee.controls.employmentStartDate)) {
                <div class="form-error">Employment start date is required</div>
                }
            </label>
        </div>
    </section>
    <section formGroupName="compensation" class="form-section">
        <h3>Compensation details</h3>
        <div class="form-grid">
            <label>
                <span class="required-label">Annual Salary</span>
                <input type="number" formControlName="annualSalary" />
                @if (isControlInvalid(form.controls.compensation.controls.annualSalary)) {
                <div class="form-error">Annual salary is required</div>
                }
            </label>
            <label>
                Bonus Percentage
                <input type="number" formControlName="bonusPercentage" />
            </label>
            <label>
                Pension Contribution Percentage
                <input type="number" formControlName="pensionContributionPercentage" />
            </label>
        </div>
    </section>

    <app-service-history-section [form]="form" (addService)="addServiceHistoryItem()"
        (removeService)="removeServiceHistoryItem($event)"></app-service-history-section>

    <section formGroupName="calculationSettings" class="form-section">
        <h3>Calculation settings</h3>
        <div class="form-grid">
            <label>
                Mode
                <select formControlName="mode">
                    <option value="current">Current calculation</option>
                    <option value="by-age">Calculation by age</option>
                    <option value="by-date">Calculation by date</option>
                </select>
            </label>
            <label>
                Target Age
                <input type="number" formControlName="targetAge" />
                @if (isControlInvalid(form.controls.calculationSettings.controls.targetAge)) {
                <div class="form-error">
                    Target age is required
                </div>
                }
            </label>
            <label>
                Target Date
                <input type="date" formControlName="targetDate" />
                @if (isControlInvalid(form.controls.calculationSettings.controls.targetDate)) {
                <div class="form-error">
                    Target date is required
                </div>
                }
            </label>
        </div>
    </section>
</form>

@if (loading()) {
<div class="status-message status-message--info">
    Loading benefits data...
</div>
}

@if (saved()) {
<div class="status-message status-message--success">
    Changes saved successfully.
</div>
}

@if (error()) {
<div class="status-message status-message--error">
    {{ error() }}
</div>
}

<div class="form-actions">
    <button type="button" (click)="onCalculate()" [disabled]="form.invalid ||calculating() || saving()">
        {{ calculating() ? 'Calculating...' : 'Calculate' }}
    </button>

    <button type="button" (click)="onSave()" [disabled]="form.invalid ||saving() || calculating()">
        {{ saving() ? 'Saving...' : 'Save' }}
    </button>
</div>

<app-calculation-summary [result]="calculationResult()" />
